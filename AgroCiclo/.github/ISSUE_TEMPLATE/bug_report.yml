name: Relato de bug
description: Reporte um comportamento incorreto
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: "1. Acesse... 2. Clique... 3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: Sistema operacional, Java, navegador etc.
  - type: checkboxes
    id: privacy
    attributes:
      label: Verificação de privacidade
      options:
        - label: Não incluí senhas, tokens, dados pessoais ou dados reais de propriedades.
          required: true
