<style>
.sol { animation: nascer 1.6s ease-out both; }
@keyframes nascer { from { transform: translateY(80px); } to { transform: none; } }
.rotor { animation: girar 14s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.passaros { animation: voar 9s ease-in-out infinite alternate; }
@keyframes voar { from { transform: translate(-14px, 4px); } to { transform: translate(14px, -4px); } }
@media (prefers-reduced-motion: reduce) { .sol, .rotor, .passaros { animation: none; } }
</style>
