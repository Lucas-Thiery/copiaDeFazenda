<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title> 🌱 AgroCiclo </title>
</head>

<body>
    <div class="divisao">
        <div class="ladoEsquerdo">
            <div class="logo">
                <h2><span>🌱</span>AgroCiclo</h2>
            </div>

            <div class="textoIntro">
                <h1>Sua fazenda e sua equipe sob seu controle.</h1>
            </div>
        </div>

        <div class="ladoDireito">

            <div class="cadastro">
                <div id="mensagemLogin" role="alert" aria-live="polite"></div>
                <h1>Entrar no AgroCiclo</h1>
                <p class="substituto">Autenticação dos perfis existentes.</p>

                <form action="/api/auth/login" method="post">
                    <label>Login
                        <input type="text" name="login" autocomplete="username" placeholder="Seu login" required>
                    </label>
                    <div class="linhaSenha">
                        <label>Senha
                            <input type="password" name="senha" autocomplete="current-password" placeholder="Sua senha" required>
                        </label>
                    </div>
                    <button type="submit" class="botaoC">Entrar</button>
                </form>
                <p class="entrar">Primeiro acesso? <a href="setup.html">Configurar a primeira propriedade</a> (requer token de implantação).</p>
            </div>
        </div>
    </div>
<script>if(new URLSearchParams(location.search).has("erro")){document.getElementById("mensagemLogin").textContent="Login ou senha inválidos, ou conta desativada.";}</script>
</body>

</html>
