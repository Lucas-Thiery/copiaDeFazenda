<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title> 🌱 AgroCiclo </title>
</head>

<body>
    <div class="divisao">
        <div class="ladoEsquerdo">
            <div class="logo">
                <h2><img src="imagens/logo-broto.svg" alt="" width="32" height="32"> AgroCiclo</h2>
            </div>

            <div class="textoIntro">
                <h1>Sua fazenda e sua equipe sob seu controle.</h1>
            </div>
        </div>

        <div class="ladoDireito">

            <div class="cadastro">
                <h1>Entrar no AgroCiclo</h1>
                <p class="substituto">Autenticação dos perfis existentes.</p>
                <div id="mensagemLogin" class="retornoFormulario" role="alert"></div>

                <form action="/api/auth/login" method="post">
                    <label>E-mail ou login
                        <input type="text" name="login" autocomplete="username" placeholder="Seu e-mail ou login" required>
                    </label>
                    <div class="linhaSenha">
                        <label>Senha
                            <input type="password" name="senha" autocomplete="current-password" placeholder="Sua senha" required>
                        </label>
                    </div>
                    <button type="submit" class="botaoC">Entrar</button>
                </form>
                <p class="entrar">Ainda não tem conta? <a href="/index.html">Criar conta</a></p>
            </div>
        </div>
    </div>
<script>
    try { sessionStorage.removeItem('agrociclo.fazenda'); } catch {}
    const parametros = new URLSearchParams(location.search);
    const mensagem = document.getElementById('mensagemLogin');
    if (parametros.has('erro')) mensagem.textContent = 'Login ou senha inválidos, ou conta desativada.';
    if (parametros.has('logout')) mensagem.textContent = 'Sessão encerrada.';
    if (parametros.has('cadastro')) mensagem.textContent = 'Conta criada. Entre com seu e-mail para cadastrar sua fazenda.';
</script>
</body>

</html>
