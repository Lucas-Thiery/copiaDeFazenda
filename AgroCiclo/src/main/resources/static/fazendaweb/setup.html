<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuração inicial · AgroCiclo</title><link rel="stylesheet" href="style.css"></head><body><main class="dashboardContainer" style="max-width:760px;margin:40px auto"><section class="cardSecao"><div class="cardSecaoHeader"><h1>🌱 Configuração inicial do AgroCiclo</h1><p>Crie a primeira propriedade e a conta Proprietário. Esta etapa só pode ser concluída uma vez.</p></div><form id="setupForm" class="formCadastroPropriedade"><label>Token de configuração (AGRO_CICLO_SETUP_TOKEN)<input name="token" type="password" required></label><div class="linhaForm"><label>Nome da propriedade<input name="propriedadeNome" required></label><label>Área total (ha)<input name="areaHectares" type="number" min="0.0001" step="0.0001" required></label></div><label>Localização textual<input name="localizacao" required></label><label>Responsável pela propriedade<input name="responsavel" required></label><hr><h3>Conta do Proprietário</h3><label>Nome completo<input name="nomeProprietario" required></label><label>Login<input name="login" autocomplete="username" required></label><label>Senha (mínimo 12 caracteres)<input name="senha" type="password" minlength="12" autocomplete="new-password" required></label><div class="botoesAcao"><a class="btnCancelar" href="login.html">Voltar ao login</a><button class="botaoC" type="submit">Criar propriedade e conta</button></div><p id="resultado" role="status" aria-live="polite"></p></form></section></main><script src="js/agrociclo-api.js"></script><script src="js/setup.js"></script></body></html>
