<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <link rel="stylesheet" href="style.css">
    <title> 🌱 AgroCiclo </title>
</head>

<body>
    <div class="divisao">
        <div class="ladoEsquerdo">
            <div class="logo">
                <h2><span>🌱</span>AgroCiclo</h2>
            </div>

            <div class="textoIntro">
                <h1>Sua fazenda e sua equipe sob seu controle.</h1>
            </div>
        </div>

        <div class="ladoDireito">

            <div class="cadastro">
                <h1>Entrar no AgroCiclo</h1>
                <p class="substituto">Autenticação dos perfis existentes.</p>

                <label>E-mail
                    <input type="text" placeholder="nome@exemplo.com">
                </label>

                <div class="linhaSenha">
                    <label>Senha
                        <input type="password" placeholder="Crie uma senha">
                    </label>
                </div>

                <!-- <button  type="submit" class="botaoC">Entrar</button>  -->
                <a href="fazendaweb/principal.html" class="botaoC"> Entrar</a>

                <label class="entrar">
                    Ainda não tem conta? <a href="index.html">Criar conta</a>
                </label>
            </div>
        </div>
    </div>
</body>

</html>
