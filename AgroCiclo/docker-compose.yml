services:
  db:
    image: postgres:18
    container_name: agrociclo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrociclo}
      POSTGRES_USER: ${POSTGRES_USER:-agrociclo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrociclo_dev}
    ports:
      - "5432:5432"
    volumes:
      - agrociclo_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agrociclo_pgdata:
